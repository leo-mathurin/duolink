services:
  sing-box:
    image: ghcr.io/sagernet/sing-box:v1.14.3
    container_name: duolink
    restart: unless-stopped
    # Host networking keeps MPTCP end to end: Docker's userland proxy would
    # terminate the connection as plain TCP and drop the extra subflows.
    network_mode: host
    volumes:
      - ./config.json:/etc/sing-box/config.json:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]
